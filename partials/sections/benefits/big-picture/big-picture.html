<div class="bicpicture-pic">
  <picture>
    <source
      media="(width < 800px)"
      srcset="
        /img/benefits/mobile/big-pic.webp    311w,
        /img/benefits/mobile/big-pic@2x.webp 622w
      "
      sizes="311px"
    />

    <source
      media="(width >= 800px) and (width < 1280px)"
      srcset="
        /img/benefits/tablet/big-pic.webp     720w,
        /img/benefits/tablet/big-pic@2x.webp 1440w
      "
      sizes="720px"
    />

    <source
      media="(width >= 1280px)"
      srcset="
        /img/benefits/big-pic.webp     590w,
        /img/benefits/big-pic@2x.webp 1180w
      "
      sizes="590px"
    />

    <img
      src="/img/benefits/big-pic.webp"
      alt="See the Big Picture"
      loading="lazy"
      class="bigpicture-pic__src"
    />
  </picture>
</div>
